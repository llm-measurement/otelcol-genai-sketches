# SPDX-License-Identifier: Apache-2.0
# Code authors: Vijay and Codex
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CHART_NAME: ghcr.io/llm-measurement/charts/otelcol-genai-sketches

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    outputs:
      chart_version: ${{ steps.versions.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Validate independent chart and runtime versions
        id: versions
        run: |
          go run ./scripts/collector-version --release-chart "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Verify source and module files
        run: |
          make tidy
          git diff --exit-code
          make check
          python3 -m unittest discover -s examples/integrations/litellm -p 'test_*.py'
          go test -race ./...
          go -C connector/genaisketchconnector test -race ./...
          make test-integration

      - name: Check dependency licenses
        run: make license-check

      - name: Scan Go dependencies
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary .cache/bin/go-licenses
          go -C connector/genaisketchconnector run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C dist run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Repository leak guard
        run: |
          ! git grep -nEi '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          ! git grep -nE 'GENAI_SKETCH_SECRET[=:].*(demo|dev)-secret-change-me'

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Validate Helm chart
        run: |
          make helm-check
          make prometheus-rule-check

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.0

      - name: Verify Helm OCI digest round-trip without publication
        run: RELEASE_OCI_TEST=1 go test ./scripts/collector-version -count=1

  # Build-owned artifacts are sealed before the scanner; scan contributes status only.
  image:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CHART_VERSION: ${{ needs.verify.outputs.chart_version }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sums: ${{ steps.seal.outputs.sums }}
      digest: ${{ steps.push.outputs.digest }}
      chart_digest: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse an existing OCI chart version
        env:
          VERSION: ${{ needs.verify.outputs.chart_version }}
        run: |
          pull_token="$(curl --fail --silent --show-error \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:llm-measurement/charts/otelcol-genai-sketches:pull' \
            | jq -er '.token')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${pull_token}" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${CHART_NAME#ghcr.io/}/manifests/${VERSION}")"
          case "${status}" in
            404) ;;
            200) echo "Chart ${VERSION} already exists; refusing to overwrite it" >&2; exit 1 ;;
            *) echo "Cannot establish chart availability (HTTP ${status})" >&2; exit 1 ;;
          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image by digest only
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      - name: Record image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p release
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > release/image-digest.txt

      - name: Package checked-in chart metadata
        run: helm package deploy/helm/otelcol-genai-sketches --destination release

      - name: Push chart by digest only
        id: chart
        run: bash scripts/publish-chart-digest.sh

      - name: Export release metadata
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p release
          printf '%s@%s\n' "${IMAGE_NAME}" "${DIGEST}" > release/image-digest.txt
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" \
            --format '{{ json .SBOM }}' > release/sbom-index.json

      - name: Verify exact Linux import graphs and generate OpenVEX
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p .cache/vex-binaries
          # Extend the same build stage without changing the shipped image.
          cp packaging/docker/Dockerfile .cache/vex.Dockerfile
          cat >> .cache/vex.Dockerfile <<'DOCKERFILE'

          FROM build AS vex-evidence
          ARG TARGETARCH
          COPY scripts/release-vex/main.go /vex/main.go
          RUN --mount=type=cache,target=/go/pkg/mod \
              --mount=type=cache,target=/root/.cache/go-build \
              mkdir /vex-evidence && \
              GOWORK=off go run /vex/main.go collect \
                --dist /out --manifest /tmp/builder.yaml --arch "$TARGETARCH" \
                --version "v${VERSION#v}" --out "/vex-evidence/vex-linux-${TARGETARCH}.json"
          FROM scratch AS vex-export
          COPY --from=vex-evidence /vex-evidence/ /
          DOCKERFILE
          container=
          trap 'if [[ -n "$container" ]]; then docker rm -f "$container"; fi' EXIT
          image_index="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" --raw)"
          for arch in amd64 arm64; do
            # Classic Docker cannot load two platforms under one index digest.
            child_digest="$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length != 1 then error("expected one Linux platform manifest") else .[0].digest end
              | if type != "string" then error("invalid platform digest")
                elif length == 71 and test("^sha256:[0-9a-f]{64}$") then .
                else error("invalid platform digest") end
            ' <<<"$image_index")"
            child_ref="${IMAGE_NAME}@${child_digest}"
            docker buildx build --no-cache --platform "linux/$arch" --target vex-export \
              --build-arg "VERSION=$VERSION" --file .cache/vex.Dockerfile \
              --output type=local,dest=release .
            docker pull --platform "linux/$arch" "$child_ref"
            container="$(docker create --platform "linux/$arch" "$child_ref")"
            docker cp "$container:/otelcol-genai-sketches" ".cache/vex-binaries/collector-linux-$arch"
            docker rm "$container"
            container=
          done
          GOWORK=off go run ./scripts/release-vex generate \
            --version "${GITHUB_REF_NAME}" --image "${IMAGE_NAME}@${DIGEST}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence release --binaries .cache/vex-binaries --out release/openvex.json

      - name: Seal release metadata
        id: seal
        run: |
          (cd release && sha256sum image-digest.txt chart-digest.txt sbom-index.json openvex.json vex-linux-*.json *.tgz > SHA256SUMS)
          printf 'sums=%s\n' "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload digest-input
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-input-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  scan:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      CHART_DIGEST: ${{ needs.image.outputs.chart_digest }}
      SUMS: ${{ needs.image.outputs.sums }}
      GOWORK: "off"
      CHART_VERSION: ${{ needs.verify.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          digest-mismatch: error
          path: release

      - name: Verify approved digest handoff
        run: |
          # Reject extra, hidden, nested, or linked publication inputs.
          shopt -s nullglob dotglob
          artifacts=(release/*)
          [[ ${#artifacts[@]} == 8 ]] || exit 1
          for artifact in "${artifacts[@]}"; do
            [[ -f "$artifact" && ! -L "$artifact" ]] || exit 1
            case "${artifact#release/}" in
              SHA256SUMS|image-digest.txt|chart-digest.txt|sbom-index.json|openvex.json|vex-linux-amd64.json|vex-linux-arm64.json|otelcol-genai-sketches-*.tgz) ;;
              *) echo "Unexpected release artifact" >&2; exit 1 ;;
            esac
          done
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  release/SHA256SUMS\n' "$SUMS" | sha256sum -c -
          (cd release && sha256sum -c SHA256SUMS)
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" | cmp - release/image-digest.txt
          printf '%s@%s\n' "$CHART_NAME" "$CHART_DIGEST" | cmp - release/chart-digest.txt

      - name: Scan published amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.74.0
          cache: false
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Scan published arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.74.0
          cache: false
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Verify digest-addressed chart bytes
        run: |
          mkdir -p "$RUNNER_TEMP/chart"
          helm pull "oci://${CHART_NAME}@${CHART_DIGEST}" --destination "$RUNNER_TEMP/chart"
          downloaded=("$RUNNER_TEMP/chart/"*.tgz)
          [[ ${#downloaded[@]} == 1 && -f "${downloaded[0]}" ]] || exit 1
          cmp "release/otelcol-genai-sketches-${CHART_VERSION}.tgz" "${downloaded[0]}"

  sign:
    needs: [image, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      CHART_DIGEST: ${{ needs.image.outputs.chart_digest }}
      SUMS: ${{ needs.image.outputs.sums }}
      GOWORK: "off"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          digest-mismatch: error
          path: release

      - name: Verify approved digest handoff
        run: |
          # Reject extra, hidden, nested, or linked publication inputs.
          shopt -s nullglob dotglob
          artifacts=(release/*)
          [[ ${#artifacts[@]} == 8 ]] || exit 1
          for artifact in "${artifacts[@]}"; do
            [[ -f "$artifact" && ! -L "$artifact" ]] || exit 1
            case "${artifact#release/}" in
              SHA256SUMS|image-digest.txt|chart-digest.txt|sbom-index.json|openvex.json|vex-linux-amd64.json|vex-linux-arm64.json|otelcol-genai-sketches-*.tgz) ;;
              *) echo "Unexpected release artifact" >&2; exit 1 ;;
            esac
          done
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  release/SHA256SUMS\n' "$SUMS" | sha256sum -c -
          (cd release && sha256sum -c SHA256SUMS)
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" | cmp - release/image-digest.txt
          printf '%s@%s\n' "$CHART_NAME" "$CHART_DIGEST" | cmp - release/chart-digest.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

      - name: Sign and verify Helm chart
        run: |
          cosign sign --yes "${CHART_NAME}@${CHART_DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CHART_NAME}@${CHART_DIGEST}"

      - name: Attest Helm chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.CHART_NAME }}
          subject-digest: ${{ needs.image.outputs.chart_digest }}
          push-to-registry: true

      - name: Attest release checksums, SBOM index, and OpenVEX provenance
        id: attest-metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/SHA256SUMS
            release/sbom-index.json
            release/openvex.json

      - name: Verify release metadata provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest-metadata.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" release/provenance.jsonl
          for subject in release/SHA256SUMS release/sbom-index.json release/openvex.json; do
            gh attestation verify "$subject" --repo "$GH_REPO" --bundle release/provenance.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done

      - name: Upload release-metadata
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, image, scan, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      CHART_DIGEST: ${{ needs.image.outputs.chart_digest }}
      SUMS: ${{ needs.image.outputs.sums }}
      GOWORK: "off"
      CHART_VERSION: ${{ needs.verify.outputs.chart_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact sign artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
          path: release

      - name: Verify approved digest handoff
        run: |
          # Reject extra, hidden, nested, or linked publication inputs.
          shopt -s nullglob dotglob
          artifacts=(release/*)
          [[ ${#artifacts[@]} == 9 ]] || exit 1
          for artifact in "${artifacts[@]}"; do
            [[ -f "$artifact" && ! -L "$artifact" ]] || exit 1
            case "${artifact#release/}" in
              SHA256SUMS|image-digest.txt|chart-digest.txt|sbom-index.json|openvex.json|vex-linux-amd64.json|vex-linux-arm64.json|otelcol-genai-sketches-*.tgz|provenance.jsonl) ;;
              *) echo "Unexpected release artifact" >&2; exit 1 ;;
            esac
          done
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  release/SHA256SUMS\n' "$SUMS" | sha256sum -c -
          (cd release && sha256sum -c SHA256SUMS)
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" | cmp - release/image-digest.txt
          printf '%s@%s\n' "$CHART_NAME" "$CHART_DIGEST" | cmp - release/chart-digest.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.0

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Verify Helm chart signature
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CHART_NAME}@${CHART_DIGEST}"

      - name: Reverify release metadata provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for subject in release/SHA256SUMS release/sbom-index.json release/openvex.json; do
            gh attestation verify "$subject" --repo "$GH_REPO" --bundle release/provenance.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Verify existing OCI chart version matches approved digest
        env:
          VERSION: ${{ needs.verify.outputs.chart_version }}
        run: |
          pull_token="$(curl --fail --silent --show-error \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:llm-measurement/charts/otelcol-genai-sketches:pull' \
            | jq -er '.token')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${pull_token}" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${CHART_NAME#ghcr.io/}/manifests/${VERSION}")"
          case "${status}" in
            404) ;;
            200)
              existing_digest="$(oras resolve "${CHART_NAME}:${VERSION}")"
              if [[ "$existing_digest" != "$CHART_DIGEST" ]]; then
                echo "Chart ${VERSION} exists with a different digest; refusing to overwrite it" >&2
                exit 1
              fi
              ;;
            *) echo "Cannot establish chart availability (HTTP ${status})" >&2; exit 1 ;;
          esac

      - name: Create or verify identical GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_commit="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${GITHUB_REF_NAME}" --jq .sha)"
          [[ "$source_commit" == "$GITHUB_SHA" ]] || exit 1
          flags=(--verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if metadata="$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft)"; then
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tagName == $tag and .isDraft == false' <<< "$metadata" > /dev/null
            existing="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
            trap 'rm -rf "$existing"' EXIT
            gh release download "$GITHUB_REF_NAME" --dir "$existing"
            shopt -s nullglob dotglob
            local_assets=(release/*)
            remote_assets=("$existing/"*)
            [[ ${#remote_assets[@]} == ${#local_assets[@]} ]] || exit 1
            for asset in "${local_assets[@]}"; do
              previous="$existing/${asset#release/}"
              [[ -f "$previous" && ! -L "$previous" ]] || exit 1
              cmp "$asset" "$previous"
            done
          else
            gh release create "${GITHUB_REF_NAME}" release/* --target "$GITHUB_SHA" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" "${flags[@]}"
          fi

      - name: Apply approved release tags last
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "${CHART_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          while IFS= read -r tag; do
            [[ "$tag" == "${IMAGE_NAME}:"* ]] || exit 1
            suffix="${tag#"${IMAGE_NAME}:"}"
            [[ "$suffix" =~ ^([0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?|sha-[0-9a-f]{7,40}|latest)$ ]] || exit 1
          done <<< "$IMAGE_TAGS"
          while IFS= read -r tag; do
            oras tag "${IMAGE_NAME}@${DIGEST}" "${tag#"${IMAGE_NAME}:"}"
            test "$(oras resolve "$tag")" = "$DIGEST"
          done <<< "$IMAGE_TAGS"
          oras tag "${CHART_NAME}@${CHART_DIGEST}" "$CHART_VERSION"
          test "$(oras resolve "${CHART_NAME}:${CHART_VERSION}")" = "$CHART_DIGEST"

      - name: Verify anonymous artifact access
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          retry() {
            local attempts=12
            until "$@"; do
              attempts=$((attempts - 1))
              if ((attempts == 0)); then
                return 1
              fi
              sleep 10
            done
          }
          docker logout ghcr.io >/dev/null
          retry oras manifest fetch "${IMAGE_NAME}@${IMAGE_DIGEST}" > /dev/null
          mkdir -p /tmp/public-chart
          retry helm pull "oci://${CHART_NAME}" \
            --version "${CHART_VERSION}" --destination /tmp/public-chart
          retry curl --fail --silent --show-error --location \
            --output /tmp/public-image-digest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/image-digest.txt"
          retry curl --fail --silent --show-error --location \
            --output /tmp/public-chart-digest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/chart-digest.txt"
          cmp "release/otelcol-genai-sketches-${CHART_VERSION}.tgz" "/tmp/public-chart/otelcol-genai-sketches-${CHART_VERSION}.tgz"
          cmp release/image-digest.txt /tmp/public-image-digest.txt
          cmp release/chart-digest.txt /tmp/public-chart-digest.txt
  public-install:
    needs: publish
    uses: ./.github/workflows/public-install.yml
    with:
      release_tag: ${{ github.ref_name }}
