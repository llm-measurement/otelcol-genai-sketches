name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CHART_NAME: ghcr.io/llm-measurement/charts/otelcol-genai-sketches

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
            connector/genaisketchconnector/go.sum

      - name: Verify source and module files
        run: |
          make tidy
          git diff --exit-code
          make check
          go test -race ./...
          go -C connector/genaisketchconnector test -race ./...
          make test-integration

      - name: Check dependency licenses
        run: make license-check

      - name: Scan Go dependencies
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary .cache/bin/go-licenses
          go -C connector/genaisketchconnector run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C dist run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Repository leak guard
        run: |
          ! git grep -nEi '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          ! git grep -nE 'GENAI_SKETCH_SECRET[=:].*(demo|dev)-secret-change-me'

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Validate Helm chart
        run: |
          make helm-check
          make prometheus-rule-check

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Scan published arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Export release metadata
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p release
          printf '%s@%s\n' "${IMAGE_NAME}" "${DIGEST}" > release/image-digest.txt
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" \
            --format '{{ json .SBOM }}' > release/sbom-index.json

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Build, publish, and sign Helm chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/otelcol-genai-sketches \
            --version "${version}" --app-version "${version}" --destination release
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          push_output="$(helm push "release/otelcol-genai-sketches-${version}.tgz" \
            oci://ghcr.io/llm-measurement/charts 2>&1)"
          printf '%s\n' "${push_output}"
          chart_digest="$(printf '%s\n' "${push_output}" | awk '$1 == "Digest:" {print $2}' | tail -n 1)"
          if [[ ! "${chart_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unable to determine published chart digest" >&2
            exit 1
          fi
          printf '%s@%s\n' "${CHART_NAME}" "${chart_digest}" > release/chart-digest.txt
          printf 'digest=%s\n' "${chart_digest}" >> "${GITHUB_OUTPUT}"
          cosign sign --yes "${CHART_NAME}@${chart_digest}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CHART_NAME}@${chart_digest}"
          (cd release && sha256sum image-digest.txt chart-digest.txt sbom-index.json *.tgz > SHA256SUMS)

      - name: Attest Helm chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.CHART_NAME }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes "${flags[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

      - name: Verify anonymous artifact access
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          retry() {
            local attempts=12
            until "$@"; do
              attempts=$((attempts - 1))
              if ((attempts == 0)); then
                return 1
              fi
              sleep 10
            done
          }
          version="${GITHUB_REF_NAME#v}"
          docker logout ghcr.io >/dev/null
          helm registry logout ghcr.io >/dev/null
          retry docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
          mkdir -p /tmp/public-chart
          retry helm pull "oci://${CHART_NAME}" \
            --version "${version}" --destination /tmp/public-chart
          retry curl --fail --silent --show-error --location \
            --output /tmp/public-image-digest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/image-digest.txt"
          retry curl --fail --silent --show-error --location \
            --output /tmp/public-chart-digest.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/chart-digest.txt"
          cmp release/image-digest.txt /tmp/public-image-digest.txt
          cmp release/chart-digest.txt /tmp/public-chart-digest.txt
