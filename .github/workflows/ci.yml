name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0

  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: |
            otelcol-genai-sketches/go.sum
            otelcol-genai-sketches/connector/genaisketchconnector/go.sum
      - name: Verify module files are tidy
        run: |
          make tidy
          git diff --exit-code
      - run: make check
      - name: Offline inspection accounting contract
        run: |
          (cd connector/genaisketchconnector/testdata/inspect-contract/v1 && sha256sum -c SHA256SUMS)
          go -C connector/genaisketchconnector test -run '^TestInspectAccountingContract$' -count=1
      - name: Usage provenance source-boundary fixtures
        run: python3 -m unittest discover -s examples/integrations/litellm -p 'test_*.py'
      - name: Provider trial offline checks (no credentials or paid calls)
        run: python3 -m unittest discover -s examples/integrations/litellm/provider-trial -p 'test_*.py'
      - name: Race detector
        run: |
          go test -race ./...
          go -C connector/genaisketchconnector test -race ./...
      - name: Check dependency licenses
        run: make license-check
      - name: Fuzz span and identity extraction
        run: |
          go -C connector/genaisketchconnector test -run '^$' -fuzz '^FuzzSpanAttributes$' -fuzztime 1000x -timeout 2m
          go -C connector/genaisketchconnector test -run '^$' -fuzz '^FuzzIdentityExtraction$' -fuzztime 1000x -timeout 2m
      - run: make test-integration
      - name: Verify generated gRPC version
        run: |
          expected="$(go list -m -f '{{.Version}}' google.golang.org/grpc)"
          actual="$(go -C dist list -m -f '{{with .Replace}}{{.Version}}{{else}}{{.Version}}{{end}}' google.golang.org/grpc)"
          printf 'root grpc=%s generated grpc=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Validate Alloy coexistence configuration
        run: make validate-alloy-config
      - name: Go vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary .cache/bin/go-licenses
          go -C connector/genaisketchconnector run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C dist run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Repository leak guard
        run: |
          ! git grep -nEi '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          ! git grep -nE 'GENAI_SKETCH_SECRET[=:].*(demo|dev)-secret-change-me'

  production-package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Validate Helm chart
        run: make helm-check
      - name: Validate Prometheus rules
        run: make prometheus-rule-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: otelcol-genai-sketches
          file: otelcol-genai-sketches/packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: otelcol-genai-sketches:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production image
        run: |
          test "$(docker image inspect otelcol-genai-sketches:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --network=none otelcol-genai-sketches:ci --version
          docker run --rm --read-only --network=none \
            -e GENAI_SKETCH_SECRET=ci-validation-secret-32-bytes-only \
            otelcol-genai-sketches:ci validate --config=/etc/otelcol-genai-sketches/config.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache-dependency-path: otelcol-genai-sketches/go.sum
      - name: Verify production-image summaries and private top-k
        env:
          GOWORK: "off"
          GENAI_TEST_IMAGE: otelcol-genai-sketches:ci
        run: |
          go test -tags integration ./integration \
            -run '^Test(IndependentCollectorsExportMergeablePrivateSummaries|SessionTopKPrivateSummaryPipeline)$' \
            -count=1 -timeout=5m -v
      - name: Exercise opt-in alerts with Prometheus
        env:
          PROMTOOL_DOCKER: "1"
        run: HELM="$(command -v helm)" go test ./deploy/helm/tests -count=1 -v
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: otelcol-genai-sketches:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

  example-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GENAI_SKETCH_SECRET: smoke-secret-32-bytes-for-ci-only
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - name: Bring up example stack
        run: sh examples/demo.sh up
      - name: Check synthetic span mix
        run: docker compose -f examples/compose.yaml run --rm --no-deps app python -m unittest -v test_app
      - name: Check dashboard aggregation and top-k presentation
        run: |
          python3 -m unittest discover -s examples -p test_dashboard.py
          python3 -m unittest discover -s examples/app -p test_topk.py
      - name: Wait for exported metrics
        run: |
          for i in $(seq 1 60); do
            metrics="$(curl -fsS http://127.0.0.1:8889/metrics || true)"
            if echo "$metrics" | grep -Eq '^gen_ai_sketch_requests_total\{.*\} [1-9]' &&
               echo "$metrics" | grep -Eq '^gen_ai_sketch_missing_token_usage_total\{.*\} [1-9]'; then
              curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose -f examples/compose.yaml logs
          exit 1
      - name: Reconcile worked investigations
        run: |
          docker compose -f examples/compose.yaml run --rm -T --no-deps app python /app/investigate.py > /tmp/investigation-results.json
          diff -u docs/investigations/results.json /tmp/investigation-results.json
      - name: Require the bounded top-k surface
        run: |
          for i in $(seq 1 15); do
            if sh examples/demo.sh logs | grep 'genaisketch topk snapshot' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Tear down example stack
        if: always()
        run: docker compose -f examples/compose.yaml down -v

  gateway-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gateway: [litellm, bifrost, agentgateway, portkey]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fixtures and evidence readers
        run: python3 -B -m unittest discover -s examples/gateway-accounting -p 'test_*.py'
      - name: Run deterministic gateway cases (no provider credentials)
        run: |
          python3 -B examples/gateway-accounting/run.py \
            --gateways '${{ matrix.gateway }}' --output .cache/gateway-study-ci
          python3 -B examples/gateway-accounting/verify.py .cache/gateway-study-ci
      # Captures can contain diagnostic and security-sensitive material. Keep
      # them off public logs and do not upload raw results as CI artifacts.

  kubernetes-summary-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install pinned kind and verified fleetdiff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/bin
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            -o .cache/bin/kind
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  .cache/bin/kind' | sha256sum -c -
          chmod +x .cache/bin/kind
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/llm-measurement/fleetdiff/v0.5.0/scripts/install.sh \
            -o .cache/install-fleetdiff.sh
          echo 'f561e95b7599485f32c2d07f1a5288a4c836ca4b9a816938991ba7e08b24a70e  .cache/install-fleetdiff.sh' | sha256sum -c -
          sh .cache/install-fleetdiff.sh v0.5.0 .cache/fleetdiff-recipe
      - name: Test private readback and initialization
        run: |
          python3 -B -m unittest discover -s deploy/kubernetes/summary-export -p 'test_*.py' -v
          python3 -B deploy/kubernetes/summary-export/check-init.py
      - name: Test rendered chart on Kubernetes with released binaries
        run: |
          python3 -B deploy/kubernetes/summary-export/check.py \
            --kind .cache/bin/kind --fleetdiff .cache/fleetdiff-recipe/fleetdiff \
            --output .cache/kubernetes-summary-export
      # No capture, credential or summary artifacts are uploaded from this job.

  coding-agent-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and install released fleetdiff v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/llm-measurement/fleetdiff/v0.5.0/scripts/install.sh \
            -o .cache/install-fleetdiff.sh
          echo 'f561e95b7599485f32c2d07f1a5288a4c836ca4b9a816938991ba7e08b24a70e  .cache/install-fleetdiff.sh' | sha256sum -c -
          sh .cache/install-fleetdiff.sh v0.5.0 .cache/fleetdiff-recipe
      - name: Test source mappings and privacy controls
        run: python3 -B -m unittest discover -s examples/integrations/coding-agents -p 'test_*.py' -v
      - name: Exercise released collector and fleetdiff with synthetic coding-agent spans
        run: |
          python3 -B examples/integrations/coding-agents/run.py \
            --fleetdiff .cache/fleetdiff-recipe/fleetdiff \
            --output .cache/coding-agent-recipe
      # Raw shadow captures contain planted identities and code. Never upload them.

  gateway-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gateway: [agentgateway, envoy-ai-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and install released fleetdiff v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/llm-measurement/fleetdiff/v0.5.0/scripts/install.sh \
            -o .cache/install-fleetdiff.sh
          echo 'f561e95b7599485f32c2d07f1a5288a4c836ca4b9a816938991ba7e08b24a70e  .cache/install-fleetdiff.sh' | sha256sum -c -
          sh .cache/install-fleetdiff.sh v0.5.0 .cache/fleetdiff-recipe
      - name: Check privacy-scanner positive controls
        run: python3 -B -m unittest discover -s examples/integrations/agentgateway -p 'test_*.py' -v
      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Render mappings with released chart 0.3.3
        run: |
          helm template rankings \
            oci://ghcr.io/llm-measurement/charts/otelcol-genai-sketches@sha256:0e7ea58a869f7e10e4d8389403bdbe3be436b49e5bcab60ee52226d58ad5b3b5 \
            -f examples/integrations/agentgateway/chart-values.yaml > /dev/null
      - name: Exercise released gateway, collector and fleetdiff
        run: |
          python3 -B examples/integrations/agentgateway/check.py \
            --gateway '${{ matrix.gateway }}' \
            --fleetdiff .cache/fleetdiff-recipe/fleetdiff \
            --output .cache/rankings-recipe
      # The private shadow copy deliberately contains synthetic identities.
      # Never upload captures, generated credentials or container logs.
