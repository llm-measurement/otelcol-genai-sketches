name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            otelcol-genai-sketches/go.sum
            otelcol-genai-sketches/connector/genaisketchconnector/go.sum
      - name: Verify module files are tidy
        run: |
          make tidy
          git diff --exit-code
      - run: make check
      - run: make test-integration
      - name: Go vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C connector/genaisketchconnector run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C dist run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Repository leak guard
        run: |
          ! git grep -nEi '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          ! git grep -nE 'GENAI_SKETCH_SECRET[=:].*(demo|dev)-secret-change-me'

  example-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    env:
      GOWORK: "off"
      GENAI_SKETCH_SECRET: smoke-secret-32-bytes-for-ci-only
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            otelcol-genai-sketches/go.sum
            otelcol-genai-sketches/connector/genaisketchconnector/go.sum
      - run: make dist-docker
      - name: Generated distro vulnerability scan
        run: go -C dist/docker run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Bring up example stack
        run: docker compose -f examples/compose.yaml up -d --build
      - name: Wait for exported metrics
        run: |
          for i in $(seq 1 60); do
            metrics="$(curl -fsS http://127.0.0.1:8889/metrics || true)"
            if echo "$metrics" | grep -Eq '^gen_ai_sketch_requests_total\{.*\} [1-9]' &&
               echo "$metrics" | grep -Eq '^gen_ai_sketch_missing_token_usage_total\{.*\} [1-9]'; then
              curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose -f examples/compose.yaml logs
          exit 1
      - name: Tear down example stack
        if: always()
        run: docker compose -f examples/compose.yaml down -v
