name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0

  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            otelcol-genai-sketches/go.sum
            otelcol-genai-sketches/connector/genaisketchconnector/go.sum
      - name: Verify module files are tidy
        run: |
          make tidy
          git diff --exit-code
      - run: make check
      - name: Race detector
        run: |
          go test -race ./...
          go -C connector/genaisketchconnector test -race ./...
      - name: Check dependency licenses
        run: make license-check
      - run: make test-integration
      - name: Verify generated gRPC version
        run: |
          expected="$(go list -m -f '{{.Version}}' google.golang.org/grpc)"
          actual="$(go -C dist list -m -f '{{with .Replace}}{{.Version}}{{else}}{{.Version}}{{end}}' google.golang.org/grpc)"
          printf 'root grpc=%s generated grpc=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Validate Alloy coexistence configuration
        run: make validate-alloy-config
      - name: Go vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary .cache/bin/go-licenses
          go -C connector/genaisketchconnector run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go -C dist run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Repository leak guard
        run: |
          ! git grep -nEi '(/[U]sers/|[g]ithub_pat_|[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          ! git grep -nE 'GENAI_SKETCH_SECRET[=:].*(demo|dev)-secret-change-me'

  production-package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Validate Helm chart
        run: make helm-check
      - name: Validate Prometheus rules
        run: make prometheus-rule-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: otelcol-genai-sketches
          file: otelcol-genai-sketches/packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: otelcol-genai-sketches:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production image
        run: |
          test "$(docker image inspect otelcol-genai-sketches:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --network=none otelcol-genai-sketches:ci --version
          docker run --rm --read-only --network=none \
            -e GENAI_SKETCH_SECRET=ci-validation-secret-32-bytes-only \
            otelcol-genai-sketches:ci validate --config=/etc/otelcol-genai-sketches/config.yaml
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: otelcol-genai-sketches:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "1"

  example-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GENAI_SKETCH_SECRET: smoke-secret-32-bytes-for-ci-only
    defaults:
      run:
        working-directory: otelcol-genai-sketches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otelcol-genai-sketches
          persist-credentials: false
      - name: Bring up example stack
        run: sh examples/demo.sh up
      - name: Check synthetic span mix
        run: docker compose -f examples/compose.yaml run --rm --no-deps app python -m unittest -v test_app
      - name: Check dashboard aggregation rules
        run: python3 -m unittest discover -s examples -p test_dashboard.py
      - name: Wait for exported metrics
        run: |
          for i in $(seq 1 60); do
            metrics="$(curl -fsS http://127.0.0.1:8889/metrics || true)"
            if echo "$metrics" | grep -Eq '^gen_ai_sketch_requests_total\{.*\} [1-9]' &&
               echo "$metrics" | grep -Eq '^gen_ai_sketch_missing_token_usage_total\{.*\} [1-9]'; then
              curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose -f examples/compose.yaml logs
          exit 1
      - name: Reconcile worked investigations
        run: |
          docker compose -f examples/compose.yaml run --rm -T --no-deps app python /app/investigate.py > /tmp/investigation-results.json
          diff -u docs/investigations/results.json /tmp/investigation-results.json
      - name: Require the bounded top-k surface
        run: |
          for i in $(seq 1 15); do
            if sh examples/demo.sh logs | grep 'genaisketch topk snapshot' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Tear down example stack
        if: always()
        run: docker compose -f examples/compose.yaml down -v
