name: CodeQL

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '17 6 * * 2'

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build root Go module
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: local
        run: go build -a -mod=readonly ./...
      - name: Build connector Go module
        if: matrix.language == 'go'
        working-directory: connector/genaisketchconnector
        env:
          GOTOOLCHAIN: local
        run: go build -a -mod=readonly ./...
      - name: Analyze and upload
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{ matrix.language }}'
          upload: always
