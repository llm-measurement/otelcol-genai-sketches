name: commit-signatures-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-signatures-trusted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every PR commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const event = context.payload.pull_request;
            const params = { ...context.repo, pull_number: event.number };
            const { data: before } = await github.rest.pulls.get(params);
            if (before.head.sha !== event.head.sha || before.head.ref !== event.head.ref ||
                before.base.ref !== event.base.ref) {
              throw new Error('PR changed since this run was requested; run the check on the current PR.');
            }

            const invalidList = 'Could not verify the complete PR commit list. PRs over 250 commits must be split.';
            if (!Number.isInteger(before.commits) || before.commits < 1 || before.commits > 250 ||
                ![before.base.sha, before.head.sha].every(sha => /^[a-f0-9]{40}$/.test(sha))) {
              throw new Error(invalidList);
            }
            // Pin every page to immutable commits; a PR can change and change back between reads.
            const commits = [];
            for (let page = 1; page <= Math.ceil(before.commits / 100); page++) {
              const { data: comparison } = await github.rest.repos.compareCommits({
                ...context.repo, base: before.base.sha, head: before.head.sha, per_page: 100, page,
              });
              if (comparison.total_commits !== before.commits || comparison.base_commit?.sha !== before.base.sha ||
                  !Array.isArray(comparison.commits) ||
                  comparison.commits.length !== Math.min(100, before.commits - (page - 1) * 100)) {
                throw new Error(invalidList);
              }
              commits.push(...comparison.commits);
            }
            const { data: after } = await github.rest.pulls.get(params);
            if (after.head.sha !== before.head.sha || after.base.sha !== before.base.sha ||
                after.base.ref !== before.base.ref || after.head.ref !== before.head.ref ||
                after.commits !== before.commits) {
              throw new Error('PR changed during verification; rerun the check.');
            }
            const shas = new Set(commits.map(commit => commit.sha));
            if (commits.length !== before.commits || shas.size !== before.commits ||
                commits.some(commit => !/^[a-f0-9]{40}$/.test(commit.sha)) ||
                !shas.has(before.head.sha)) {
              throw new Error(invalidList);
            }

            const unverified = commits.filter(commit => commit.commit?.verification?.verified !== true);
            for (const commit of unverified) {
              const reason = commit.commit?.verification?.reason ?? 'verification unavailable';
              core.error(`Unverified commit ${commit.sha}: ${reason}`);
            }
            if (unverified.length > 0) {
              core.setFailed(`${unverified.length} of ${commits.length} PR commits are not verified. Sign every commit and push the updated branch.`);
            } else {
              core.info(`All ${commits.length} PR commits have verified signatures.`);
            }
