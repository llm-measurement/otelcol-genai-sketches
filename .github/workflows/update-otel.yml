name: update-otel-collector

on:
  pull_request:
    paths:
      - .github/workflows/update-otel.yml
      - scripts/update_otel_collector.sh
      - scripts/prepare_otel_update.py
      - scripts/test_prepare_otel_update.py
  schedule:
    - cron: "17 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-otel-collector
  cancel-in-progress: false

jobs:
  patch-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test patch packaging without network access
        run: python3 -m unittest discover -s scripts -p test_prepare_otel_update.py -v

  update:
    needs: patch-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: |
            go.sum
            connector/genaisketchconnector/go.sum
      - name: Update Collector dependencies
        run: scripts/update_otel_collector.sh
      - name: Check the updated dependencies
        run: make check
      - name: Prepare a patch for maintainer review
        id: patch
        run: python3 scripts/prepare_otel_update.py "$RUNNER_TEMP/collector-dependency-update"
      - name: Upload the dependency update patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-dependency-update
          path: ${{ runner.temp }}/collector-dependency-update/
          if-no-files-found: error
          retention-days: 14
