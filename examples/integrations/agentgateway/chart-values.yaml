# Chart 0.3.4: metrics and snapshot logs. The Docker recipe exports summary files.
image:
  tag: '0.3.2'
  digest: sha256:f30001c845e4da7c14f97357eb0dcfa615e267cf84cbc18794808ac7c98ad933
shadow:
  enabled: true
  endpoint: existing-collector.observability.svc.cluster.local:4317
  insecure: false
connector:
  topK: 10
  topKKeys:
    - {field: user_key, weight: tokens}
    - {field: session_key, weight: requests}
    - {field: workflow_key, weight: tokens}
  slices:
    - {name: by_model, keys: [gen_ai.request.model]}
  fields:
    user_key:
      from_attributes: [user.id]
      canonicalization: text_v1
      domain: user:v1
    session_key:
      from_attributes: [session.id]
      canonicalization: text_v1
      domain: session:v1
    workflow_key:
      from_attributes: [app.workflow]
      canonicalization: text_v1
      domain: user:v1
