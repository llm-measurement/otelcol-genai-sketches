x-runtime: &runtime
  read_only: true
  user: '${RECIPE_UID}:${RECIPE_GID}'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 1g
  cpus: 2
  networks: [recipe]
  tmpfs: ['/tmp:size=128m,mode=1777']
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '2'}
x-collector: &collector
  <<: *runtime
  # Released collector v0.3.0, shared with Recipe A.
  image: ghcr.io/llm-measurement/otelcol-genai-sketches@sha256:c7fef29869ada99345725cf8504c8bd265357f570a23f1344769d362e595211c
  volumes:
    - .:/recipe:ro
    - ${RECIPE_OUTPUT}:/evidence
services:
  cli:
    <<: *collector
    depends_on: [backend]
    command: [--config=/recipe/collector.yaml, --config=/recipe/copilot-cli.yaml]
    environment:
      GENAI_SKETCH_SECRET: ${GENAI_SKETCH_SECRET}
      CODING_AGENT: cli
  chat:
    <<: *collector
    depends_on: [backend]
    command: [--config=/recipe/collector.yaml, --config=/recipe/copilot-chat.yaml]
    environment:
      GENAI_SKETCH_SECRET: ${GENAI_SKETCH_SECRET}
      CODING_AGENT: chat
  driver:
    <<: *runtime
    image: python@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    command: [python, -B, -c, 'import time; time.sleep(900)']
    volumes:
      - ..:/integrations:ro
      - ${RECIPE_OUTPUT}:/evidence
  backend:
    <<: *runtime
    image: otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: [--config=/recipe/backend.yaml]
    volumes:
      - ./backend.yaml:/recipe/backend.yaml:ro
      - ${RECIPE_OUTPUT}:/evidence
  loki:
    <<: *runtime
    image: grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: [-config.file=/recipe/loki.yaml]
    volumes:
      - ../agentgateway/loki.yaml:/recipe/loki.yaml:ro
networks:
  recipe: {internal: true}
