model_list:
  - model_name: baseline
    litellm_params: &normal
      model: openai/gpt-5.4-2026-03-05
      api_base: http://relay:8080/case/baseline/v1
      api_key: dummy-relay-only
      timeout: 45
      num_retries: 0
  - model_name: retry429
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/retry429/v1
  - model_name: timeout
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/timeout/v1
      timeout: 8
  - model_name: stream_complete
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/stream_complete/v1
  - model_name: stream_cut
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/stream_cut/v1
  - model_name: cache
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/cache/v1
  - model_name: reasoning
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/reasoning/v1
  - model_name: tools
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/tools/v1
  - model_name: retry429_enabled
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/retry429_enabled/v1
      num_retries: 1
  - model_name: timeout_enabled
    litellm_params:
      <<: *normal
      api_base: http://relay:8080/case/timeout_enabled/v1
      timeout: 8
      num_retries: 1
router_settings:
  num_retries: 1
  retry_after: 1
litellm_settings:
  callbacks: [provenance_callback.callback]
  turn_off_message_logging: true
  request_timeout: 45
general_settings:
  master_key: sk-local-trial-only
  allow_client_side_credentials: false
