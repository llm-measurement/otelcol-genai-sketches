# Deterministic one-minute counter timelines, not provider or billing data.
rule_files:
  - "rules.yml"
evaluation_interval: "1m"
fuzzy_compare: true
tests:
  -
    name: "20x fast burn; 1x peer stays quiet"
    interval: "1m"
    input_series:
      -
        series: "gen_ai_token_budget_tokens{slice=\"by_team\",slice_value=\"team.id=platform\"}"
        values: "2592000+0x360"
      -
        series: "gen_ai_token_budget_tokens{slice=\"by_team\",slice_value=\"team.id=inference\"}"
        values: "2592000+0x360"
      -
        series: "gen_ai_sketch_total_tokens_total{job=\"otelcol-genai-sketches\",slice=\"by_team\",slice_value=\"team.id=platform\",overflow=\"false\",instance=\"one\"}"
        values: "0+1200x360"
      -
        series: "gen_ai_sketch_total_tokens_total{job=\"otelcol-genai-sketches\",slice=\"by_team\",slice_value=\"team.id=inference\",overflow=\"false\",instance=\"one\"}"
        values: "0+60x360"
    alert_rule_test:
      -
        eval_time: "6h"
        alertname: "GenAITokenBudgetFastBurn"
        exp_alerts:
          -
            exp_labels:
              slice: "by_team"
              slice_value: "team.id=platform"
              severity: "critical"
            exp_annotations:
              summary: "Fast token-budget burn for team.id=platform"
              description: "Reported token rate exceeds 14.4 times the 30-day allowance in both the 1h and 5m windows."
      -
        eval_time: "6h"
        alertname: "GenAITokenBudgetSlowBurn"
        exp_alerts:
          -
            exp_labels:
              slice: "by_team"
              slice_value: "team.id=platform"
              severity: "warning"
            exp_annotations:
              summary: "Slow token-budget burn for team.id=platform"
              description: "Reported token rate exceeds 6 times the 30-day allowance in both the 6h and 30m windows."
      -
        eval_time: "6h"
        alertname: "GenAITokenBudgetMissing"
        exp_alerts: []
      -
        eval_time: "6h"
        alertname: "GenAITokenBudgetUnattributed"
        exp_alerts: []
    promql_expr_test:
      -
        expr: "gen_ai_token_budget:burn_rate5m"
        eval_time: "6h"
        exp_samples:
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate5m\",slice=\"by_team\",slice_value=\"team.id=platform\"}"
            value: 20
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate5m\",slice=\"by_team\",slice_value=\"team.id=inference\"}"
            value: 1
      -
        expr: "gen_ai_token_budget:burn_rate1h"
        eval_time: "6h"
        exp_samples:
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate1h\",slice=\"by_team\",slice_value=\"team.id=platform\"}"
            value: 20
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate1h\",slice=\"by_team\",slice_value=\"team.id=inference\"}"
            value: 1
      -
        expr: "gen_ai_token_budget:burn_rate30m"
        eval_time: "6h"
        exp_samples:
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate30m\",slice=\"by_team\",slice_value=\"team.id=platform\"}"
            value: 20
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate30m\",slice=\"by_team\",slice_value=\"team.id=inference\"}"
            value: 1
      -
        expr: "gen_ai_token_budget:burn_rate6h"
        eval_time: "6h"
        exp_samples:
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate6h\",slice=\"by_team\",slice_value=\"team.id=platform\"}"
            value: 20
          -
            labels: "{__name__=\"gen_ai_token_budget:burn_rate6h\",slice=\"by_team\",slice_value=\"team.id=inference\"}"
            value: 1
  -
    name: "8x slow burn only"
    interval: "1m"
