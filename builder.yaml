dist:
  name: otelcol-genai-sketches
  description: GenAI sketch metrics collector
  output_path: ./dist
  otelcol_version: 0.162.0
  version: 0.6.2-dev
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.162.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.162.0
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.162.0
connectors:
  - gomod: github.com/llm-measurement/otelcol-genai-sketches/connector/genaisketchconnector v0.6.2-dev
    path: ./connector/genaisketchconnector
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.162.0
replaces:
  - go.opentelemetry.io/otel => go.opentelemetry.io/otel v1.47.0
  - go.opentelemetry.io/otel/trace => go.opentelemetry.io/otel/trace v1.47.0
  - go.opentelemetry.io/otel/metric => go.opentelemetry.io/otel/metric v1.47.0
  - go.opentelemetry.io/otel/log => go.opentelemetry.io/otel/log v1.47.0
  - go.opentelemetry.io/otel/sdk => go.opentelemetry.io/otel/sdk v1.47.0
  - go.opentelemetry.io/otel/sdk/metric => go.opentelemetry.io/otel/sdk/metric v1.47.0
  - go.opentelemetry.io/otel/sdk/log => go.opentelemetry.io/otel/sdk/log v1.47.0
  - github.com/klauspost/compress => github.com/klauspost/compress v1.20.2
  - github.com/prometheus/common => github.com/prometheus/common v0.73.1
  - google.golang.org/grpc => google.golang.org/grpc v1.85.0
  - golang.org/x/crypto => golang.org/x/crypto v0.59.0
  - golang.org/x/net => golang.org/x/net v0.62.0
