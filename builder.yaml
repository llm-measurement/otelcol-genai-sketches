dist:
  name: otelcol-genai-sketches
  description: GenAI sketch metrics collector
  output_path: ./dist
  otelcol_version: 0.162.0
  version: 0.3.0-dev
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.162.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.162.0
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.162.0
connectors:
  - gomod: github.com/llm-measurement/otelcol-genai-sketches/connector/genaisketchconnector v0.3.0-dev
    path: ./connector/genaisketchconnector
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.162.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.162.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.162.0
replaces:
  - google.golang.org/grpc => google.golang.org/grpc v1.83.2
  - golang.org/x/crypto => golang.org/x/crypto v0.56.0
