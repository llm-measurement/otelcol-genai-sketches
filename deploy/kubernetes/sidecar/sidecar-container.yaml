# Code authors: Vijay and Codex
# Merge this list item into spec.template.spec.containers in an application Deployment.
- name: genai-sketches
  # Released collector v0.3.1.
  image: ghcr.io/llm-measurement/otelcol-genai-sketches@sha256:d1eb959970df82149512e47bbb6b1a699445f3e0e360a7a0f965fcd090a8aa7c
  imagePullPolicy: IfNotPresent
  args: ["--config", "/etc/otelcol-genai-sketches/config.yaml"]
  env:
    - name: GENAI_SKETCH_SECRET
      valueFrom:
        secretKeyRef:
          name: genai-sketch-secret
          key: secret
    - {name: GENAI_SKETCH_MEMORY_LIMIT_MIB, value: "922"}
    - {name: GENAI_SKETCH_MEMORY_SPIKE_MIB, value: "154"}
  ports:
    - {name: sketch-metrics, containerPort: 8889}
    - {name: sketch-health, containerPort: 13133}
  startupProbe:
    httpGet: {path: /, port: sketch-health}
    failureThreshold: 30
    periodSeconds: 2
  readinessProbe:
    httpGet: {path: /, port: sketch-health}
  livenessProbe:
    httpGet: {path: /, port: sketch-health}
    periodSeconds: 30
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile: {type: RuntimeDefault}
    capabilities: {drop: [ALL]}
