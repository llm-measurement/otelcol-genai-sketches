# Replace these namespace and workload labels before installation.
networkPolicy:
  enabled: true
  allowSameNamespace: false
  otlpFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: applications
      podSelector:
        matchLabels:
          app.kubernetes.io/name: telemetry-sender
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
